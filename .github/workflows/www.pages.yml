name: Publish current Pages closure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ktransformers-pages
  cancel-in-progress: false

jobs:
  build-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
      - name: Build mutable current closure
        run: bash actions/www.pages.sh
      - name: Upload Pages tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: www-static
          path: static
          if-no-files-found: error

  deploy-www:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download current closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: www-static
          path: static
      - name: Checkout publication branch
        uses: actions/checkout@v6
        with:
          ref: www
          path: published
      - name: Replace current files and preserve releases
        run: |
          rsync -a --delete --exclude '/.git/' --exclude '/releases/' static/ published/
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet || git commit -m "publish current ${GITHUB_SHA}"
          git push origin HEAD:www
